- name: Setup dotfiles vars
  set_fact:
    dotfiles_home: "{{ dotfiles_home | mandatory }}"
    dotfiles_dir: "{{ dotfiles_dir | default('$HOME') }}"
    config_dir: "{{ config_dir | default('$HOME/.config') }}"

- name: Create {{ config_dir }} directory
  file:
    path: "{{ config_dir }}"
    state: directory

- name: Find config files
  find:
    paths: "{{ dotfiles_home }}/config"
    recurse: no
    file_type: any
    hidden: yes
    patterns: "*[!.old]"
  register: find_configs

- name: Setup {{ config_dir }}
  when: find_configs.files | length > 0
  loop: "{{ find_configs.files }}"
  loop_control:
    label: "{{ item.path }}/{{ item.path | basename }}"
  file:
    src: "{{ item.path }}"
    dest: "{{ config_dir }}/{{ item.path | basename }}"
    state: link

- name: zsh
  file:
    src: "{{ dotfiles_home }}/zsh/.zshrc"
    dest: "{{ dotfiles_dir }}/.zshrc"
    state: link

- name: git
  file:
    src: "{{ dotfiles_home }}/git/.gitconfig"
    dest: "{{ dotfiles_dir }}/.gitconfig"
    state: link

- name: claude settings
  file:
    src: "{{ dotfiles_home }}/claude/settings.json"
    dest: "{{ dotfiles_dir }}/.claude/settings.json"
    state: link

# Personal skills live in the repo; globally installed skills (npx skills add -g)
# write into this same directory. Keep it a real dir so the two can coexist.
- name: Create {{ dotfiles_dir }}/.agents/skills directory
  file:
    path: "{{ dotfiles_dir }}/.agents/skills"
    state: directory

- name: Find personal agent skills
  find:
    paths: "{{ dotfiles_home }}/agents/skills"
    recurse: no
    file_type: directory
  register: find_agent_skills

- name: Link personal agent skills into {{ dotfiles_dir }}/.agents/skills
  when: find_agent_skills.files | length > 0
  loop: "{{ find_agent_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  file:
    src: "{{ item.path }}"
    dest: "{{ dotfiles_dir }}/.agents/skills/{{ item.path | basename }}"
    state: link
